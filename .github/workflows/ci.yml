name: CI

on:
  push:
    branches: [main, loco-rewrite, nestjs-rewrite]
  pull_request:

env:
  JWT_SECRET: ci-test-jwt-secret
  DEEPSEEK_API_KEY: ci-test-dummy-key

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
